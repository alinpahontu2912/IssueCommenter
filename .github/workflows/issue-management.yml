name: TorchSharp Issue Management

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which script to run'
        required: true
        type: choice
        options:
          - both
          - comment
          - close
        default: 'both'
      days_threshold:
        description: 'Days to look back for old issues (commenter, default 730)'
        required: false
        default: '730'
        type: string
      close_threshold:
        description: 'Days to wait before closing after bot comment (closer, default 14)'
        required: false
        default: '14'
        type: string

jobs:
  comment-issues:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.mode == 'both' ||
      github.event.inputs.mode == 'comment'
    
    permissions:
      issues: write
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai==0.28.0 requests
    
    - name: Run commenter script
      env:
        GITHUB_TOKEN: ${{ secrets.AI_TOKEN }}
        DAYS_THRESHOLD: ${{ inputs.days_threshold || '730' }}
      run: python commenter.py
    
    - name: Upload logs as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: commenter-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

  close-issues:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.mode == 'both' ||
      github.event.inputs.mode == 'close'
    
    permissions:
      issues: write
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai==0.28.0 requests
    
    - name: Run closer script
      env:
        GITHUB_TOKEN: ${{ secrets.AI_TOKEN }}
        CLOSE_THRESHOLD_DAYS: ${{ inputs.close_threshold || '14' }}
      run: python closer.py
    
    - name: Upload logs as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: closer-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30
