name: TorchSharp Issue Management

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      days_threshold:
        description: 'Number of days to look back for old issues - default is 730 (2 years)'
        required: false
        default: '730'
        type: string

jobs:
  manage-issues:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai requests

    # run every 2 weeks
    - name: Check if this is an even ISO week
      run: |
        WEEK_NUM=$(date -u +%V)
        echo "Week number: $WEEK_NUM"
        if [ $((10#$WEEK_NUM % 2)) -ne 0 ]; then
          echo "This is not an even week. Exiting."
          exit 0
        fi
  
    - name: Run issue management script
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DAYS_THRESHOLD: ${{ inputs.days_threshold }}
      run: |
        python commenter.py
    
    - name: Upload logs as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: issue-management-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30
